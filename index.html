<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schatzsuche</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="ph.search" aria-label="Search">
<div id="recipes" role="toolbar">
  <button data-act="quote" data-i18n="r.word" data-i18n-tip="t.word"></button>
  <button data-add="in:notes" data-i18n="r.notes" data-i18n-tip="t.notes"></button>
  <button data-add="in:calendar since:30d" data-i18n="r.journal" data-i18n-tip="t.journal"></button>
  <button data-add="is:not-task" data-i18n="r.notask" data-i18n-tip="t.notask"></button>
  <button data-add="heading:" data-wait="1" data-i18n="r.heading" data-i18n-tip="t.heading"></button>
  <button data-add="in:archive" data-i18n="r.archive" data-i18n-tip="t.archive"></button>
  <span class="sep"></span>
  <button data-add="@TAG" data-i18n="r.tag" data-i18n-tip="t.tag"></button>
  <button data-add="@TAG since:year" data-i18n="r.tagyear" data-i18n-tip="t.tagyear"></button>
  <span class="sep"></span>
  <button data-add="is:open" data-i18n="r.open" data-i18n-tip="t.open"></button>
  <button data-add="is:done since:30d" data-i18n="r.done" data-i18n-tip="t.done"></button>
  <button data-act="newest" data-i18n="r.newest" data-i18n-tip="t.newest"></button>
  <span class="sep rd-only"></span>
  <button class="rd-only" data-add="in:raindrop" data-i18n="r.rd" data-i18n-tip="t.rd"></button>
  <button class="rd-only" data-add="in:raindrop important:true" data-i18n="r.fav" data-i18n-tip="t.fav"></button>
</div>
<details id="help"><summary data-i18n="h.title"></summary><table id="syntax"></table></details>
<details id="rdbox" class="rd-only"><summary>Raindrop: <span id="rdstat"></span></summary><p data-i18n="h.rd"></p></details>
<div id="view"><span data-i18n="v.text"></span><button data-text="short" data-i18n="v.short" data-i18n-tip="v.shorttip"></button><button data-text="medium" data-i18n="v.medium" data-i18n-tip="v.mediumtip"></button><button data-text="full" data-i18n="v.full" data-i18n-tip="v.fulltip"></button>
  <span class="sep2 rd-only">·</span><button class="rd-only" data-img="1" data-i18n="v.img" data-i18n-tip="v.imgtip"></button></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="results" role="listbox"></div>
<div id="kiste" hidden><span id="kn"></span><button id="kshow" class="primary" data-i18n="k.show"></button><button id="kclear" data-i18n="k.clear"></button></div>
<div id="kdlg" hidden><div class="kbox" role="dialog" aria-modal="true" aria-labelledby="khead">
  <h2 id="khead">Schatzkiste</h2>
  <div class="kz"><span data-i18n="k.target"></span>
    <label><input type="radio" name="kziel" value="new" checked> <span data-i18n="k.new"></span></label>
    <label><input type="radio" name="kziel" value="today"> <span data-i18n="k.today"></span></label>
    <label><input type="radio" name="kziel" value="clip"> <span data-i18n="k.clip"></span></label></div>
  <div class="kz"><label for="ktitle" data-i18n="k.title"></label> <input id="ktitle" size="28"></div>
  <div class="kz" id="knew"><label for="kfolder" data-i18n="k.folder"></label> <select id="kfolder"></select></div>
  <div class="kz"><span data-i18n="k.md"></span> <button id="krefresh" data-i18n="k.refresh" data-i18n-tip="k.refreshtip"></button></div>
  <textarea id="kmd" spellcheck="false" aria-label="Markdown"></textarea>
  <div class="kfoot"><span id="kmsg"></span><button id="kclose" data-i18n="k.close"></button><button id="kgo" class="primary" data-i18n="k.save"></button></div>
</div></div>
<script src="app.js"></script>
</body>
</html>
